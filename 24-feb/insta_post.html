<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Posts</title>
     <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>

      #posts-container{
        margin-left: 600px;  
      }
      .post {
        border: 1px solid #ccc;
        padding: 10px;
       
        margin: 10px;
        width: 300px;
        
      }
      .profile-pic {
        width: 50px;
        height: 50px;
        border-radius: 50%;
      }
      .post-image {
        width: 100%;
      }
      .likes-comments {
        display: flex;
        justify-content: space-between;
      }
      .profile-pic strong{
       margin-bottom: 50px;
      }
      .name{
       /* background-color: aqua; */
       text-align: center;
       position: absolute;
       margin-top: 15px;
       margin-left: 3px;
      
       
      }
    </style>
  </head>
  <body>
    <div  id="posts-container"></div>

    <script>
      const posts = [
        {
          id: 1,
          username: "codeacademy_official",
          profilePic:
            "https://developers.elementor.com/docs/assets/img/elementor-placeholder-image.png",
          image:
            "https://developers.elementor.com/docs/assets/img/elementor-placeholder-image.png",
          likes: 1245,
          comments: 89,
          description:
            "Build Product Cards using Fetch API :fire: #javascript #webdev",
        },
        {
          id: 2,
          username: "frontend_master",
          profilePic:
            "https://developers.elementor.com/docs/assets/img/elementor-placeholder-image.png",
          image:
            "https://developers.elementor.com/docs/assets/img/elementor-placeholder-image.png",
          likes: 980,
          comments: 45,
          description: "Understanding async/await made simple :rocket:",
        },
      ];

      const postsContainer = document.getElementById("posts-container");
      posts.forEach((post) => {
        const postElement = document.createElement("div");
        postElement.classList.add("post");
        postElement.innerHTML = `
        <div>
            <img src="${post.profilePic}" alt="${post.username}'s profile picture" class="profile-pic">
            <strong class="name" >${post.username}</strong>
            </div>
            <img src="${post.image}" alt="Post image" class="post-image">
            <p>${post.description}</p>
            <div class="likes-comments">
                <span><i class="fa-solid fa-heart"></i> ${post.likes}</span>
                <span><i class="fa-solid fa-comment"></i>${post.comments}</span>
                </div>
`;
        postsContainer.appendChild(postElement);
      });
      fetch("https://my-json-server.typicode.com/msbAtGit/instafeed-api/posts")
        .then((response) => response.json())
        .then((posts) => {
          const postsContainer = document.getElementById("posts-container");
          posts.forEach((post) => {
            const postElement = document.createElement("div");
            postElement.classList.add("post");
            postElement.innerHTML = `<div>
                <img src="${post.profilePic}" alt="${post.username}'s profile picture" class="profile-pic">
                <strong class="name">${post.username}</strong>
                </div>
                <img src="${post.image}" alt="Post image" class="post-image">
                <p>${post.description}</p>
                <div class="likes-comments">
                    <span><i class="fa-solid fa-heart"></i> ${post.likes}</span>
                    <span><i class="fa-solid fa-comment"></i> ${post.comments}</span>
                    </div>`;
            postsContainer.appendChild(postElement);
          });
        })
        .catch((error) => console.error("Error fetching posts:", error));
    </script>
  </body>
</html>
