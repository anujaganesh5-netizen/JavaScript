<!doctype html>
<html>
  <head>
     <title>Product Card Sample</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 30px;
      }

      .card {
        width: 250px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        padding: 15px;
        text-align: center;
      }

      .card img {
        width: 100%;
        height: 180px;
        object-fit: contain;
        margin-bottom: 10px;
      }

      .title {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .category {
        font-size: 13px;
        color: gray;
        margin-bottom: 5px;
      }

      .price {
        font-size: 18px;
        color: green;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .rating {
        font-size: 14px;
        margin-bottom: 10px;
      }

      .stock {
        font-size: 13px;
        margin-bottom: 12px;
      }

      .btn {
        background-color: black;
        color: white;
        padding: 8px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
      }

      .btn:hover {
        background-color: #333;
      }

      #product-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }
      .search{
        background-color: lavenderblush;
        color: black;
        margin-bottom: 30px;
        width: 300px;
        height: 20px;
        text-align: center;
        margin-left: 500px;
        border: 2px solid black;
      }
    </style>
  </head>

  <body>
    <input class= "search" type="text" placeholder="Search">
    <div id="product-container"></div>

    <script>
      fetch(
        "https://my-json-server.typicode.com/msbAtGit/bootcamp-products-api/products",
      )
        .then((response) => response.json())
        .then((data) => {
          let container = document.getElementById("product-container");

          for (let i = 0; i < data.length; i++) {
            let card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
            <img src="${data[i].image}" alt="Product-Image">
            <div class="title">${data[i].title}</div>
            <div class="category">${data[i].category}</div>
            <div class="price">₹${data[i].price}</div>
            <div class="rating">⭐ ${data[i].rating.rate} (${data[i].rating.count} reviews)</div>
            <div class="stock">In Stock: ${data[i].stock}</div>
            <button class="btn"> Add to Cart</button>
            `;

            container.appendChild(card);
          }
        })
        .catch((error) => console.error("Error:", error));
    </script>
  </body>
</html>
